<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Featured home | CK Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="adm" id="adm" data-page="featured">
  <aside class="sb" id="sb" aria-label="Admin navigation"></aside>
  <div class="sb-scrim" id="sbScrim" hidden></div>
  <div class="main">
    <header class="tb" id="tb"></header>
    <main class="content" id="content">

      <div class="fg">
        <section class="card c-feat fc rv" id="fCur"></section>
        <section class="card fpick rv">
          <div class="c-head"><h2>Pick this week's home</h2></div>
          <label class="t-search"><i data-ic="search"></i><span class="sr">Search available homes</span><input id="fSearch" type="search" placeholder="Search available homes"></label>
          <div class="fp-list" id="fList" role="radiogroup" aria-label="Available homes"></div>
          <p class="mdl-note" id="fNote"></p>
          <button type="button" class="pbtn acc" id="fGo" disabled></button>
        </section>
        <section class="card c-table rv fhist">
          <div class="c-head"><h2>Featured history</h2><span class="muted sm">Each pick keeps its start and end date.</span></div>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Home</th><th>Featured from</th><th>Until</th><th>Days</th><th>Picked by</th></tr></thead><tbody id="fHist"></tbody></table></div>
        </section>
      </div>
    </main>
    <p class="sample-note pg-note">Sample data. Changes are kept for this browser tab only.</p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="admin.js" defer></script>
</body>
</html>
