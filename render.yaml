services:
  - type: web
    name: isqa8210-termproject
    runtime: node
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /
    disk:
      name: application-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: DATABASE_URL
        value: file:/var/data/site.db
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'false'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
