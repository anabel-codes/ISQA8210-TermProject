{% load static %}{% if secondary %}
<span class="estate-photo">
  <img class="estate-day" src="{% static 'img/estates/neighborhood-day-small.webp' %}" srcset="{% static 'img/estates/neighborhood-day-small.webp' %} 800w, {% static 'img/estates/neighborhood-day.webp' %} 1800w" sizes="{{ sizes|default:'(max-width: 900px) 100vw, 50vw' }}" alt="Illustrative stock photo of a home in daylight" loading="lazy" decoding="async">
  <img class="estate-night" src="{% static 'img/estates/night-kent-small.webp' %}" srcset="{% static 'img/estates/night-kent-small.webp' %} 800w, {% static 'img/estates/night-kent.webp' %} 1564w" sizes="{{ sizes|default:'(max-width: 900px) 100vw, 50vw' }}" alt="Illustrative stock photograph edited to a night scene" loading="lazy" decoding="async">
</span>{% else %}
<span class="estate-photo">
  {% if banner %}<img class="estate-day" src="{% static 'img/estates/day-banner-wide-small.webp' %}" srcset="{% static 'img/estates/day-banner-wide-small.webp' %} 800w, {% static 'img/estates/day-banner-wide.webp' %} 2065w" sizes="100vw" alt="Illustrative sunny red house photograph with expanded framing" loading="eager" fetchpriority="high" decoding="async">{% else %}
  <img class="estate-day" src="{% static 'img/estates/day-small.webp' %}" srcset="{% static 'img/estates/day-small.webp' %} 800w, {% static 'img/estates/day.webp' %} 1800w" sizes="{{ sizes|default:'(max-width: 900px) 100vw, 60vw' }}" alt="Illustrative stock photo of a red house in bright sunshine"{% if eager %} loading="eager" fetchpriority="high"{% else %} loading="lazy"{% endif %} decoding="async">{% endif %}
  <img class="estate-night" src="{% static 'img/estates/night-kent-small.webp' %}" srcset="{% static 'img/estates/night-kent-small.webp' %} 800w, {% static 'img/estates/night-kent.webp' %} 1564w" sizes="{{ sizes|default:'(max-width: 900px) 100vw, 60vw' }}" alt="Illustrative stock photograph edited to a night scene"{% if eager %} loading="eager"{% else %} loading="lazy"{% endif %} decoding="async">
</span>{% endif %}
